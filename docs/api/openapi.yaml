openapi: 3.0.3
info:
  title: Multinova API
  version: 1.0.0
  description: REST API for users, inventory, customers, sales, and bills.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - { name: Authentication }
  - { name: Users }
  - { name: Brands }
  - { name: Categories }
  - { name: Products }
  - { name: Prices }
  - { name: Customers }
  - { name: Sales }
  - { name: Bills }
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      security: []
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/verify:
    post:
      tags: [Authentication]
      summary: Verify a user's email
      security: []
      requestBody: { $ref: '#/components/requestBodies/VerifyRequest' }
      responses:
        '200': { description: Email verified, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset code
      security: []
      requestBody: { $ref: '#/components/requestBodies/ForgotPasswordRequest' }
      responses:
        '200': { description: Request accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset a password
      security: []
      requestBody: { $ref: '#/components/requestBodies/ResetPasswordRequest' }
      responses:
        '200': { description: Password reset }
        '400': { $ref: '#/components/responses/BadRequest' }
  /users:
    post:
      tags: [Users]
      summary: Register a user
      security: []
      requestBody: { $ref: '#/components/requestBodies/UserRequest' }
      responses:
        '201': { description: User created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Users]
      summary: Get a user
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Update a user
      requestBody: { $ref: '#/components/requestBodies/UserPatch' }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands:
    get:
      tags: [Brands]
      summary: List brands
      responses: { '200': { description: Brands, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Brand' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      tags: [Brands]
      summary: Create a brand
      requestBody: { $ref: '#/components/requestBodies/NameRequest' }
      responses: { '201': { description: Brand created, content: { application/json: { schema: { $ref: '#/components/schemas/Brand' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /brands/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Brands]
      summary: Get a brand
      responses: { '200': { description: Brand, content: { application/json: { schema: { $ref: '#/components/schemas/Brand' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Brands]
      summary: Replace a brand
      requestBody: { $ref: '#/components/requestBodies/NameRequest' }
      responses: { '200': { description: Updated brand, content: { application/json: { schema: { $ref: '#/components/schemas/Brand' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Brands]
      summary: Delete a brand
      responses: { '204': { description: Brand deleted }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /categories:
    get:
      tags: [Categories]
      summary: List categories
      responses: { '200': { description: Categories, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } }
    post:
      tags: [Categories]
      summary: Create a category
      requestBody: { $ref: '#/components/requestBodies/NameRequest' }
      responses: { '201': { description: Category created, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /categories/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Categories]
      summary: Get a category
      responses: { '200': { description: Category, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Categories]
      summary: Replace a category
      requestBody: { $ref: '#/components/requestBodies/NameRequest' }
      responses: { '200': { description: Updated category, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Categories]
      summary: Delete a category
      responses: { '204': { description: Category deleted }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /products:
    get:
      tags: [Products]
      summary: List products
      responses: { '200': { description: Products, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } } } }
    post:
      tags: [Products]
      summary: Create a product
      requestBody: { $ref: '#/components/requestBodies/ProductRequest' }
      responses: { '201': { description: Product created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /products/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Products]
      summary: Get a product
      responses: { '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Products]
      summary: Update a product
      requestBody: { $ref: '#/components/requestBodies/ProductPatch' }
      responses: { '200': { description: Updated product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Products]
      summary: Delete a product
      responses: { '204': { description: Product deleted }, '404': { $ref: '#/components/responses/NotFound' } }
  /products/{productId}/prices:
    parameters: [ { $ref: '#/components/parameters/ProductId' } ]
    get:
      tags: [Prices]
      summary: List product prices
      responses: { '200': { description: Price history, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Price' } } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [Prices]
      summary: Create a product price
      requestBody: { $ref: '#/components/requestBodies/PriceRequest' }
      responses: { '201': { description: Price created, content: { application/json: { schema: { $ref: '#/components/schemas/Price' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /products/{productId}/prices/current:
    parameters: [ { $ref: '#/components/parameters/ProductId' } ]
    get:
      tags: [Prices]
      summary: Get the current product price
      responses: { '200': { description: Current price, content: { application/json: { schema: { $ref: '#/components/schemas/Price' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      responses: { '200': { description: Customers, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Customer' } } } } } }
    post:
      tags: [Customers]
      summary: Create a customer
      requestBody: { $ref: '#/components/requestBodies/CustomerRequest' }
      responses: { '201': { description: Customer created, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /customers/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Customers]
      summary: Get a customer
      responses: { '200': { description: Customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Customers]
      summary: Update a customer
      requestBody: { $ref: '#/components/requestBodies/CustomerPatch' }
      responses: { '200': { description: Updated customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Customers]
      summary: Delete a customer
      responses: { '204': { description: Customer deleted }, '404': { $ref: '#/components/responses/NotFound' } }
  /sales:
    get:
      tags: [Sales]
      summary: List sales
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/SaleStatus' } }
      responses: { '200': { description: Sales, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Sale' } } } } } }
    post:
      tags: [Sales]
      summary: Create a sale
      requestBody: { $ref: '#/components/requestBodies/SaleRequest' }
      responses: { '201': { description: Sale created, content: { application/json: { schema: { $ref: '#/components/schemas/Sale' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /sales/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    delete:
      tags: [Sales]
      summary: Cancel a sale
      description: Cancels the sale rather than physically deleting it.
      responses: { '204': { description: Sale cancelled }, '404': { $ref: '#/components/responses/NotFound' } }
  /bills:
    get:
      tags: [Bills]
      summary: List bills
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/BillStatus' } }
      responses: { '200': { description: Bills, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Bill' } } } } } }
    post:
      tags: [Bills]
      summary: Create a bill
      requestBody: { $ref: '#/components/requestBodies/BillRequest' }
      responses: { '201': { description: Bill created, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }, '400': { $ref: '#/components/responses/BadRequest' } }
  /bills/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Bills]
      summary: Get a bill
      responses: { '200': { description: Bill, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Bills]
      summary: Delete a bill
      responses: { '204': { description: Bill deleted }, '404': { $ref: '#/components/responses/NotFound' } }
  /bills/{id}/pay:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      tags: [Bills]
      summary: Mark a bill as paid
      responses: { '200': { description: Paid bill, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    ProductId: { name: productId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Access denied, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Request conflicts with current state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  requestBodies:
    LoginRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
    VerifyRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VerifyRequest' } } } }
    ForgotPasswordRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordRequest' } } } }
    ResetPasswordRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } } }
    UserRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserRequest' } } } }
    UserPatch: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserPatch' } } } }
    NameRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NameRequest' } } } }
    ProductRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRequest' } } } }
    ProductPatch: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPatch' } } } }
    PriceRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PriceRequest' } } } }
    CustomerRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerRequest' } } } }
    CustomerPatch: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPatch' } } } }
    SaleRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaleRequest' } } } }
    BillRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BillRequest' } } } }
  schemas:
    Error:
      type: object
      required: [message, status]
      properties: { message: { type: string }, status: { type: integer, format: int32 } }
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string }, password: { type: string, format: password } }
    LoginResponse:
      type: object
      required: [token]
      properties: { token: { type: string } }
    VerifyRequest:
      type: object
      required: [email, code]
      properties: { email: { type: string }, code: { type: string } }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email: { type: string, format: email }
        code: { type: string, minLength: 5, maxLength: 5 }
        newPassword: { type: string, format: password, minLength: 8 }
    UserRequest:
      type: object
      required: [name, email, password]
      properties: { name: { type: string, minLength: 1 }, email: { type: string, format: email }, password: { type: string, format: password, minLength: 8 } }
    UserPatch:
      type: object
      properties: { name: { type: string }, email: { type: string, format: email } }
    User:
      type: object
      properties: { id: { type: integer, format: int64 }, name: { type: string }, email: { type: string, format: email }, createdAt: { type: string, format: date-time } }
    NameRequest:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1 } }
    Brand:
      type: object
      properties: { id: { type: integer, format: int64 }, name: { type: string }, userId: { type: integer, format: int64 } }
    Category:
      type: object
      properties: { id: { type: integer, format: int64 }, name: { type: string }, userId: { type: integer, format: int64 } }
    ProductRequest:
      type: object
      required: [name]
      properties:
        brandId: { type: integer, format: int64, nullable: true }
        categoryId: { type: integer, format: int64, nullable: true }
        brandCode: { type: string, maxLength: 50, nullable: true }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, nullable: true }
        imageUrl: { type: string, maxLength: 500, nullable: true }
        stock: { type: integer, minimum: 0, default: 0 }
    ProductPatch:
      type: object
      properties:
        brandId: { type: integer, format: int64, nullable: true }
        categoryId: { type: integer, format: int64, nullable: true }
        brandCode: { type: string, maxLength: 50, nullable: true }
        name: { type: string, maxLength: 255, nullable: true }
        description: { type: string, nullable: true }
        imageUrl: { type: string, maxLength: 500, nullable: true }
        stock: { type: integer, minimum: 0, nullable: true }
    Product:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        brandId: { type: integer, format: int64, nullable: true }
        brandName: { type: string, nullable: true }
        categoryId: { type: integer, format: int64, nullable: true }
        categoryName: { type: string, nullable: true }
        brandCode: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        stock: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PriceRequest:
      type: object
      required: [purchasePrice, salePrice]
      properties: { purchasePrice: { type: number, minimum: 0 }, salePrice: { type: number, minimum: 0 } }
    Price:
      type: object
      properties: { id: { type: integer, format: int64 }, productId: { type: integer, format: int64 }, purchasePrice: { type: number }, salePrice: { type: number }, createdAt: { type: string, format: date-time } }
    CustomerBase:
      type: object
      properties:
        name: { type: string }
        address: { type: string, nullable: true }
        phone: { type: string, pattern: '^\\d{10,15}$', nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        photoUrl: { type: string, format: uri, nullable: true }
        preferences: { type: string, nullable: true }
        debtBalance: { type: number }
    CustomerRequest:
      allOf: [ { $ref: '#/components/schemas/CustomerBase' } ]
      required: [name, debtBalance]
    CustomerPatch:
      allOf: [ { $ref: '#/components/schemas/CustomerBase' } ]
    Customer:
      allOf:
        - { $ref: '#/components/schemas/CustomerBase' }
        - type: object
          properties: { id: { type: integer, format: int64 }, userId: { type: integer, format: int64 }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    SaleItemRequest:
      type: object
      required: [productId, quantity, unitPrice]
      properties: { productId: { type: integer, format: int64 }, quantity: { type: integer, minimum: 1 }, unitPrice: { type: number, minimum: 0 } }
    SaleRequest:
      type: object
      required: [customerId, items]
      properties: { customerId: { type: integer, format: int64 }, items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SaleItemRequest' } } }
    SaleItem:
      type: object
      properties: { productId: { type: integer, format: int64 }, productName: { type: string }, quantity: { type: integer }, unitPrice: { type: number }, subtotal: { type: number } }
    SaleStatus: { type: string, enum: [COMPLETED, CANCELLED] }
    Sale:
      type: object
      properties:
        id: { type: integer, format: int64 }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        totalAmount: { type: number }
        saleDate: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/SaleItem' } }
        status: { $ref: '#/components/schemas/SaleStatus' }
    BillRequest:
      type: object
      required: [name, amount, dueDate]
      properties: { name: { type: string, minLength: 1 }, amount: { type: number, exclusiveMinimum: true, minimum: 0 }, dueDate: { type: string, format: date } }
    BillStatus: { type: string, enum: [PENDING, PAID] }
    Bill:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        name: { type: string }
        amount: { type: number }
        dueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/BillStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
